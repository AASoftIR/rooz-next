name: Rooz AppImage (x86_64)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rooz-appimage-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  appimage:
    name: Test and build AppImage (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            build-essential pkg-config curl wget file libxdo-dev libssl-dev \
            librsvg2-dev patchelf libfuse2 xdg-utils
      - name: Compile and test TypeScript frontend
        run: |
          npm install --no-save --no-package-lock --ignore-scripts typescript@5.8.3
          npm run typecheck
          npm run build:web
          git diff --exit-code -- web/
      - name: SQLite compatibility, migration and AppImage packaging tests
        run: |
          python3 tests/test_routines_db.py
          python3 tests/test_ai_storage.py
          python3 tests/test_packaging.py
          python3 tests/test_desktop_voice.py
          python3 tests/test_appimage_runtime.py
          python3 tests/test_kde_install.py
          python3 tests/test_appimage_updater.py
          node tests/test_kwin_anchor.js
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked
      - name: Run native Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build AppImage only
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
        run: cargo tauri build --bundles appimage
      - name: Verify generated AppImage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage; found ${#appimages[@]}" >&2
            exit 1
          fi
          bash scripts/verify-appimage.sh "${appimages[0]}"
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rooz-appimage-x86_64
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish AppImage release
    needs: [appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rooz-appimage-x86_64
          path: dist
      - name: Verify AppImage and write checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          appimages=(*.AppImage)
          test "${#appimages[@]}" -eq 1
          test -s "${appimages[0]}"
          sha256sum "${appimages[0]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
