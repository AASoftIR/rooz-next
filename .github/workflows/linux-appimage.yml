name: Rooz AppImage (x86_64)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rooz-appimage-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  appimage:
    name: Test and build AppImage (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing serv00 HTTP uploader secrets
        env:
          SERV00_UPLOAD_URL: ${{ secrets.SERV00_UPLOAD_URL }}
          SERV00_UPLOAD_TOKEN: ${{ secrets.SERV00_UPLOAD_TOKEN }}
        run: bash scripts/upload-serv00.sh --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            build-essential pkg-config curl wget file libxdo-dev libssl-dev \
            librsvg2-dev patchelf libfuse2 xdg-utils
      - name: Compile and test TypeScript frontend
        run: |
          npm install --no-save --no-package-lock --ignore-scripts typescript@5.8.3
          npm run typecheck
          npm run build:web
          node --check web/assistant.js
      - name: SQLite compatibility, migration and AppImage packaging tests
        run: |
          python3 tests/test_routines_db.py
          python3 tests/test_routine_checklists.py
          python3 tests/test_ai_storage.py
          python3 tests/test_packaging.py
          python3 tests/test_desktop_voice.py
          python3 tests/test_local_stt.py
          python3 tests/test_fast_voice.py
          python3 tests/test_natural_voice.py
          python3 tests/test_v0410_recovery.py
          python3 tests/test_v0411_features.py
          python3 tests/test_v0412_core.py
          python3 tests/test_appimage_runtime.py
          python3 tests/test_kde_install.py
          python3 tests/test_appimage_updater.py
          python3 tests/test_serv00_deploy.py
          node tests/test_kwin_anchor.js
          node tests/test_transfer.mjs
          node tests/test_v0412.mjs
          node tests/test_v0412_preview.mjs
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked
      - name: Run native Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build AppImage only
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
        run: cargo tauri build --bundles appimage
      - name: Verify generated AppImage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage; found ${#appimages[@]}" >&2
            exit 1
          fi
          bash scripts/verify-appimage.sh "${appimages[0]}"
      - name: Upload verified AppImage to existing serv00 token API
        env:
          SERV00_UPLOAD_URL: ${{ secrets.SERV00_UPLOAD_URL }}
          SERV00_UPLOAD_TOKEN: ${{ secrets.SERV00_UPLOAD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1
          bash scripts/upload-serv00.sh "${appimages[0]}"
